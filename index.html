
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLBUS Task Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      color: #202125;
      margin: 0;
      padding: 24px 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: 16px;
    }
    h1 { font-size: 26px; }
    h3 { margin-top: 0; }
    .small { color: #777; font-size: 13px; }
    #status { font-weight: 600; line-height: 1.6; }
    .task {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }
    .task:first-child { border-top: none; }
    .task-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 10px 0;
    }
    .task-id { font-size: 12px; color: #777; }
    .task-meta { font-size: 13px; color: #555; }
    .hidden { display: none; }
    .error { color: #b42318; }
    .success { color: #16733b; }
  </style>
</head>
<body>
  <div class="small">ALLBUS · TASK MANAGER</div>
  <h1>Керування запитами</h1>

  <div class="card">
    <h3>Підключення</h3>
    <p id="status">Перевіряємо Telegram...</p>
    <p id="user" class="small"></p>
  </div>

  <div class="card hidden" id="tasksCard">
    <h3>Останні запити</h3>
    <div id="tasks"></div>
  </div>

  <p class="small">Тестова версія 0.4 · Перегляд без редагування</p>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbw7xNwCNg7yTX9mhmIhXeOEKjyIIzLTCJWjD5aPdZx4HO6RXC2_utvoDvk_9warhLoN/exec";

    const tg = window.Telegram?.WebApp;
    const statusEl = document.getElementById("status");
    const userEl = document.getElementById("user");
    const tasksCard = document.getElementById("tasksCard");
    const tasksEl = document.getElementById("tasks");

    const requestId =
      String(Date.now()) + "-" + Math.random().toString(36).slice(2);

    const bridge = document.createElement("iframe");
    bridge.style.display = "none";
    bridge.setAttribute("title", "ALLBUS API");

    let completed = false;
    let bridgeOrigin = null;

    function setError(message) {
      statusEl.textContent = message;
      statusEl.className = "error";
    }

    function renderTasks(result) {
      completed = true;
      statusEl.textContent = "Підключення успішне";
      statusEl.className = "success";

      userEl.textContent =
        "Користувач: " + (result.user?.name || "Менеджер");

      const tasks = Array.isArray(result.tasks)
        ? result.tasks
        : [];

      tasksEl.replaceChildren();
      tasksCard.classList.remove("hidden");

      if (tasks.length === 0) {
        tasksEl.textContent = "Завдань поки немає.";
        return;
      }

      for (const task of tasks) {
        const item = document.createElement("div");
        item.className = "task";

        const id = document.createElement("div");
        id.className = "task-id";
        id.textContent = "ID: " + (task.id || "—");

        const text = document.createElement("div");
        text.className = "task-text";
        text.textContent = task.text || "Без тексту";

        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent =
          "Відповідальний: " + (task.responsible || "—") +
          " · Статус: " + (task.status || "—");

        item.append(id, text, meta);
        tasksEl.appendChild(item);
      }
    }

    if (!tg || !tg.initData) {
      setError(
        "Дані авторизації не отримано. Відкрий Mini App через Telegram."
      );
    } else {
      tg.ready();
      tg.expand();

      statusEl.textContent = "Підключаємося до сервера...";

      window.addEventListener("message", function(event) {
        if (event.source !== bridge.contentWindow) return;

        // Google Apps Script може завантажувати HTML
        // через власний домен googleusercontent.com.
        if (!bridgeOrigin || event.origin !== bridgeOrigin) return;

        const data = event.data;

        if (!data || data.requestId !== requestId) return;

        if (data.type === "ALLBUS_TASKS_RESULT") {
          renderTasks(data.result || {});
        }

        if (data.type === "ALLBUS_TASKS_ERROR") {
          completed = true;
          setError(
            "Помилка авторизації або завантаження: " +
            (data.message || "Невідома помилка")
          );
        }
      });

      bridge.addEventListener("load", function() {
        // Відправлення запиту до iframe буде налаштовано
        // після перевірки його фактичного origin.
        statusEl.textContent =
          "Сервер завантажено. Перевіряємо канал зв'язку...";
      });

      bridge.src = API_URL;
      document.body.appendChild(bridge);
    }
  </script>
</body>
</html>
