<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALLBUS Task Manager</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#202125;margin:0;padding:24px 16px}
.small{color:#777;font-size:13px}.card{background:white;border-radius:18px;padding:20px;margin-top:16px}
h1{font-size:26px;margin:12px 0}h3{margin:0 0 12px}#status{font-weight:600;line-height:1.5}
.error{color:#b42318}.success{color:#16733b}.filters,.actions,.editor-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;cursor:pointer}
button.active,.primary{background:#202125;color:#fff;border-color:#202125}button:disabled{opacity:.5;cursor:wait}
input,textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:15px;font-family:inherit}
textarea{min-height:110px;resize:vertical}.task{border-top:1px solid #eee;padding:16px 0}.task:first-child{border-top:0}
.task-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;line-height:1.45}
.task-meta{font-size:13px;color:#555;line-height:1.7}.task-id{font-size:12px;color:#777}
.editor{margin-top:12px;padding:14px;background:#f5f5f7;border-radius:14px}.editor-title{font-weight:600;margin-bottom:10px}
.notice{font-size:13px;margin-top:8px}.hidden{display:none}
</style>
</head>
<body>
<div class="small">ALLBUS · TASK MANAGER</div>
<h1 id="pageTitle">Керування запитами</h1>
<section class="card"><h3>Підключення</h3><p id="status">Перевіряємо Telegram...</p><p id="user" class="small"></p></section>
<section class="card hidden" id="tasksCard">
  <h3 id="listTitle">Робочі запити <span class="small" id="count"></span></h3>
  <div id="listControls">
    <input id="search" type="search" placeholder="Пошук за текстом, ID, менеджером">
    <div class="filters"><button class="active" data-filter="all">Усі</button><button data-filter="pending">Очікують</button><button data-filter="done">Виконані</button></div>
  </div>
  <div id="tasks"></div>
  <button id="showAll" class="hidden">← Усі запити</button>
</section>
<p class="small">Версія 1.0 · Приватний перегляд конкретного запиту · Останні 300 запитів</p>
<script>
(() => {
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbw7xNwCNg7yTX9mhmIhXeOEKjyIIzLTCJWjD5aPdZx4HO6RXC2_utvoDvk_9warhLoN/exec';
const tg=window.Telegram&&window.Telegram.WebApp;
const status=document.getElementById('status'), userEl=document.getElementById('user');
const tasksCard=document.getElementById('tasksCard'),tasksEl=document.getElementById('tasks');
const searchEl=document.getElementById('search'),countEl=document.getElementById('count');
const listControls=document.getElementById('listControls'),showAll=document.getElementById('showAll');
const listTitle=document.getElementById('listTitle'),pageTitle=document.getElementById('pageTitle');
const iframe=document.createElement('iframe');
let allTasks=[],allPartners=[],currentFilter='all',bridgeWindow=null,bridgeOrigin=null,loaded=false;
const pending=new Map();
const rawStart=String(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param||new URLSearchParams(location.search).get('tgWebAppStartParam')||'');
const match=/^task_([a-zA-Z0-9-]{1,64})$/.exec(rawStart);
let focusedTaskId=match?match[1]:null;
const isDone=value=>/виконано|виконаний|завершено/i.test(String(value||''));
const showError=message=>{status.textContent=message;status.className='error';};
function request(type,fields={}){
 return new Promise((resolve,reject)=>{
  if(!bridgeWindow||!bridgeOrigin){reject(new Error('Немає зв’язку із сервером'));return;}
  const requestId=String(Date.now())+'-'+Math.random().toString(36).slice(2);
  const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Сервер не відповів за 30 секунд'));},30000);
  pending.set(requestId,{resolve,reject,timer});
  bridgeWindow.postMessage({type,requestId,initData:tg.initData,...fields},bridgeOrigin);
 });
}
async function refreshTasks(){
 const result=await request('ALLBUS_GET_TASKS',{focusedId:focusedTaskId||''});
 allTasks=Array.isArray(result.tasks)?result.tasks:[];allPartners=Array.isArray(result.partners)?result.partners:[];
 userEl.textContent='Менеджер: '+(result.user&&result.user.name||'—');
 tasksCard.classList.remove('hidden');render();
}
function makeButton(label,callback){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',callback);return b;}
function openEditor(item,task,action){
 const previous=item.querySelector('.editor');if(previous)previous.remove();
 const editor=document.createElement('div');editor.className='editor';
 const heading=document.createElement('div');heading.className='editor-title';heading.textContent=action==='edit'?'✏️ Редагувати запит':'➕ Додати уточнення';
 const field=document.createElement('textarea');field.maxLength=3500;
 field.placeholder=action==='edit'?'Введіть новий текст запиту':'Напишіть уточнення';
 field.value=action==='edit'?task.text||'':'';
 const controls=document.createElement('div');controls.className='editor-buttons';
 const notice=document.createElement('div');notice.className='notice';
 const cancel=makeButton('Скасувати',()=>editor.remove());
 const save=makeButton('Зберегти',async()=>{
  const text=field.value.trim();if(!text){notice.textContent='Введіть текст';notice.className='notice error';return;}
  save.disabled=true;cancel.disabled=true;notice.textContent='Зберігаємо...';notice.className='notice';
  try{
   await request('ALLBUS_UPDATE_TASK',{taskId:String(task.id),action,text});
   await refreshTasks();
  }catch(err){notice.textContent='Помилка: '+err.message;notice.className='notice error';}
  finally{save.disabled=false;cancel.disabled=false;}
 });
 save.className='primary';controls.append(save,cancel);editor.append(heading,field,controls,notice);item.appendChild(editor);field.focus();
}
function openRoutePreview(item,task){
 const previous=item.querySelector('.editor');if(previous)previous.remove();
 const panel=document.createElement('div');panel.className='editor';
 const title=document.createElement('div');title.className='editor-title';title.textContent='Перевірка передачі запиту';
 const select=document.createElement('select');select.style.width='100%';select.style.padding='12px';
 allPartners.forEach(p=>{const option=document.createElement('option');option.value=p.key;option.textContent=p.name;select.appendChild(option);});
 const notice=document.createElement('p');notice.className='notice';
 const confirm=makeButton('Підтвердити передавання',async()=>{
   if(!window.confirm('Передати запит партнеру '+select.options[select.selectedIndex].text+'? Це реальна дія.'))return;
   confirm.disabled=true;btn.disabled=true;
   try{const res=await request('ALLBUS_ROUTE_SUBMIT',{taskId:String(task.id),targetKey:select.value});notice.textContent=res.message||'Запит додано до черги';notice.className='notice success';}
   catch(e){notice.textContent=e.message;notice.className='notice error';confirm.disabled=false;btn.disabled=false;}
 });confirm.className='primary';confirm.disabled=true;
 select.addEventListener('change',()=>{confirm.disabled=true;notice.textContent='';});
 const btn=makeButton('Перевірити',async()=>{btn.disabled=true;try{const res=await request('ALLBUS_ROUTE_PREVIEW',{taskId:String(task.id),targetKey:select.value});notice.textContent='Адресат: '+res.target+'\nТекст: '+res.text+'\n'+res.warning;notice.style.whiteSpace='pre-wrap';confirm.disabled=false;}catch(e){notice.textContent=e.message;notice.className='notice error';}finally{btn.disabled=false;}});
 panel.append(title,select,btn,confirm,notice,makeButton('Закрити',()=>panel.remove()));item.appendChild(panel);
}
function render(){
 const focused=Boolean(focusedTaskId);
 listControls.classList.toggle('hidden',focused);showAll.classList.toggle('hidden',!focused);
 pageTitle.textContent=focused?'Керування запитом':'Керування запитами';
 listTitle.textContent=focused?'Запит №'+focusedTaskId:'Робочі запити';
 if(!focused){const span=document.createElement('span');span.className='small';span.id='count';listTitle.append(' ',span);}
 const query=searchEl.value.trim().toLocaleLowerCase('uk');
 const visible=allTasks.filter(task=>{
  if(focused)return String(task.id)===focusedTaskId;
  const done=isDone(task.status);
  if(currentFilter==='done'&&!done)return false;
  if(currentFilter==='pending'&&done)return false;
  return !query||[task.id,task.text,task.responsible,task.status,task.author].some(v=>String(v||'').toLocaleLowerCase('uk').includes(query));
 });
 const count=document.getElementById('count');if(count)count.textContent='('+visible.length+')';
 tasksEl.replaceChildren();
 if(!visible.length){tasksEl.textContent=focused?'Запит не знайдено серед останніх 300. Жодних змін не внесено.':'За цим фільтром запитів немає.';return;}
 for(const task of visible){
  const item=document.createElement('div');item.className='task';
  const id=document.createElement('div');id.className='task-id';id.textContent='ID: '+(task.id||'—')+' · '+(task.created||'');
  const body=document.createElement('div');body.className='task-text';body.textContent=task.text||'Без тексту';
  const meta=document.createElement('div');meta.className='task-meta';meta.textContent='Відповідальний: '+(task.responsible||'—')+' · Статус: '+(task.status||'—');
  const actions=document.createElement('div');actions.className='actions';
  actions.append(makeButton('✏️ Редагувати',()=>openEditor(item,task,'edit')),makeButton('➕ Додати уточнення',()=>openEditor(item,task,'clarify')));
  if(!isDone(task.status))actions.append(makeButton('📨 Перевірити передачу',()=>openRoutePreview(item,task)));
  item.append(id,body,meta,actions);tasksEl.appendChild(item);
 }
}
showAll.addEventListener('click',()=>{focusedTaskId=null;render();});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
 currentFilter=button.dataset.filter;
 document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===button));render();
}));
searchEl.addEventListener('input',render);
if(!tg||!tg.initData){showError('Дані авторизації відсутні. Відкрийте Mini App через Telegram.');return;}
tg.ready();tg.expand();status.textContent='З’єднуємося із сервером...';
iframe.style.display='none';iframe.title='ALLBUS API';iframe.setAttribute('referrerpolicy','no-referrer');
window.addEventListener('message',event=>{
 if(!/^https:\/\/[a-z0-9.-]*googleusercontent\.com$/i.test(event.origin))return;
 const data=event.data;if(!data||typeof data!=='object')return;
 if(data.type==='ALLBUS_BRIDGE_READY'){
  if(!bridgeWindow){bridgeWindow=event.source;bridgeOrigin=event.origin;
   status.textContent='Перевіряємо доступ і завантажуємо запити...';
   refreshTasks().then(()=>{loaded=true;status.textContent='Підключено успішно';status.className='success';}).catch(err=>showError('Помилка: '+err.message));
  }return;
 }
 if(!data.requestId||!pending.has(data.requestId))return;
 const entry=pending.get(data.requestId);pending.delete(data.requestId);clearTimeout(entry.timer);
 if(data.type==='ALLBUS_TASKS_RESULT'||data.type==='ALLBUS_UPDATE_RESULT'||data.type==='ALLBUS_ROUTE_PREVIEW_RESULT'||data.type==='ALLBUS_ROUTE_SUBMIT_RESULT')entry.resolve(data.result||{});
 else if(data.type==='ALLBUS_TASKS_ERROR'||data.type==='ALLBUS_UPDATE_ERROR'||data.type==='ALLBUS_ROUTE_PREVIEW_ERROR'||data.type==='ALLBUS_ROUTE_SUBMIT_ERROR')entry.reject(new Error(data.message||'Помилка сервера'));
 else entry.reject(new Error('Невідома відповідь сервера'));
});
iframe.src=API_URL;document.body.appendChild(iframe);
setTimeout(()=>{if(!loaded)showError('Не вдалося завантажити запити. Перевірте підключення.');},35000);
})();
</script>
</body>
</html>
